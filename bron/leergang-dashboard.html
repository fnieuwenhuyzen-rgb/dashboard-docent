<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Leergang muziek</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky header + tab bar, one scrolling main, slide-in week drawer. Timeline = CSS grid of lesweeks. */
:root{
  --bg:#f3f5f9;--surface:#ffffff;--fg:#1b2230;--muted:#5d6878;--line:#d8dde6;--accent:#2d56c9;--accent-fg:#ffffff;
  --theorie:#dce6fa;--theorie-fg:#1f3f8f;--praktijk:#d8f0de;--praktijk-fg:#1b6436;--slow:#f7e8c3;--slow-fg:#7a5410;
  --toets:#fad9d9;--toets-fg:#9b1c1c;--uitval:#e7e9ee;--uitval-fg:#6b7280;--leeg:#f8f9fb;--tw:#efe4f8;--tw-fg:#5b2d8a;
  --jazz:#d99a16;--pop:#dd584c;--barok:#2a8f8a;--warn:#b45309;--warn-bg:#fff4e0;--ok:#15803d;--ok-bg:#e7f6ea;--info-bg:#e9eefb;
  --display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;--body:"Instrument Sans",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13171f;--surface:#1b2130;--fg:#e8ecf3;--muted:#9aa5b8;--line:#2d3647;--accent:#7b9af5;--accent-fg:#0f1420;
  --theorie:#233a68;--theorie-fg:#bccdf8;--praktijk:#1e4330;--praktijk-fg:#a9e3bb;--slow:#4a3a14;--slow-fg:#f1d48a;--toets:#4e2323;--toets-fg:#f5b5b5;--uitval:#2a3040;--uitval-fg:#9aa3b2;--leeg:#1f2634;--tw:#3a2a52;--tw-fg:#d9c3f3;
  --warn:#f5b45a;--warn-bg:#3a2a12;--ok:#7bd591;--ok-bg:#16301f;--info-bg:#232c45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13171f;--surface:#1b2130;--fg:#e8ecf3;--muted:#9aa5b8;--line:#2d3647;--accent:#7b9af5;--accent-fg:#0f1420;
  --theorie:#233a68;--theorie-fg:#bccdf8;--praktijk:#1e4330;--praktijk-fg:#a9e3bb;--slow:#4a3a14;--slow-fg:#f1d48a;--toets:#4e2323;--toets-fg:#f5b5b5;--uitval:#2a3040;--uitval-fg:#9aa3b2;--leeg:#1f2634;--tw:#3a2a52;--tw-fg:#d9c3f3;
  --warn:#f5b45a;--warn-bg:#3a2a12;--ok:#7bd591;--ok-bg:#16301f;--info-bg:#232c45;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.35rem .5rem}
textarea{width:100%;min-height:3.5rem;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.2rem;padding-block:.7rem}
.klas{display:flex;gap:.35rem;flex-wrap:wrap}
.klas button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:.2rem .7rem;font-size:.85rem}
.klas button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.klas button:disabled{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
.badge{font-size:.78rem;color:var(--muted);display:inline-flex;align-items:center;gap:.35rem}
.badge i{width:.55rem;height:.55rem;border-radius:50%;background:var(--muted);display:inline-block}
.badge.db i{background:var(--ok)}.badge.local i{background:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:.3rem .7rem;font-size:.85rem}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--toets-fg)}
.btn.small{padding:.1rem .45rem;font-size:.75rem}
nav.tabs{display:flex;gap:.1rem;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:transparent;padding:.55rem .8rem;border-bottom:3px solid transparent;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
nav.tabs .n{font-family:var(--mono);font-size:.7rem;background:var(--uitval);color:var(--uitval-fg);border-radius:999px;padding:0 .4rem;margin-left:.3rem}
nav.tabs .n.warn{background:var(--warn-bg);color:var(--warn)}
main{padding-block:1rem 4rem;max-width:1400px;margin:0 auto}
section.view[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.lead{color:var(--muted);max-width:65ch}
.chip{display:inline-block;font-family:var(--mono);font-size:.72rem;padding:.05rem .4rem;border-radius:4px;background:var(--uitval);color:var(--uitval-fg);margin:.1rem .15rem .1rem 0}
.chip.kaart{background:var(--slow);color:var(--slow-fg)}
.chip.syl{background:var(--theorie);color:var(--theorie-fg)}
.chip.syl.miss{background:var(--toets);color:var(--toets-fg)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.mb{background:var(--info-bg);color:var(--accent)}
.chip.fa{background:var(--ok-bg);color:var(--ok)}
.chip.id{background:var(--tw);color:var(--tw-fg)}
.les .ti.lnk{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.les .vr{font-style:italic;font-size:.82rem;opacity:.9;margin-top:.1rem}
.ubd{margin-bottom:.8rem;padding:.6rem 1rem}
.ubd summary{cursor:pointer;font-weight:600;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.ubdgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.8rem 1.4rem;margin-top:.8rem;font-size:.88rem}
.ubdgrid h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:.4rem 0 .2rem}
.ubdgrid ul{margin:0;padding-left:1.1rem}
.ubdgrid p{margin:0}
.idbox{background:var(--tw);color:var(--tw-fg);border-radius:8px;padding:.5rem .8rem;grid-column:1/-1}
.idbox h3{color:inherit}
.idset{background:var(--tw);color:var(--tw-fg)}
.idset label{color:inherit}
.lesd{border:1px solid var(--line);border-radius:8px;padding:.3rem .6rem}
.lesd summary{cursor:pointer;padding:.3rem 0}
.lesd fieldset{margin:.5rem 0}
.matlist{font-size:.85rem;display:grid;gap:.2rem}
.t-theorie{background:var(--theorie);color:var(--theorie-fg)}
.t-praktijk{background:var(--praktijk);color:var(--praktijk-fg)}
.t-uitval{background:var(--uitval);color:var(--uitval-fg)}
.t-toets{background:var(--toets);color:var(--toets-fg)}
.t-toetsweek{background:var(--tw);color:var(--tw-fg)}
.t-leeg{background:var(--leeg);color:var(--muted);border:1px dashed var(--line)}
.b-band{background:#7a4a9c}.b-speel{background:#b23a52}.b-orkest{background:#2f7d6d}.b-leer{background:#8a6d3b}.b-open{background:#6f7887}
.b-jazz{background:var(--jazz)}.b-pop{background:var(--pop)}.b-barok{background:var(--barok)}.b-klassiek{background:#6b5bbf}.b-renaissance{background:#8a6d3b}.b-examen{background:#5d6878}
.concept{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:.5rem .8rem;margin-bottom:1rem;font-size:.88rem}
.concept[hidden]{display:none}
.les .acts button.geef{background:var(--fg);color:var(--bg);border-color:var(--fg);opacity:1;font-weight:600}
/* alle klassen */
.weekgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.8rem;margin-bottom:1rem}
.kcard{padding:.7rem .8rem;display:grid;gap:.35rem;align-content:start}
.kcard .kh{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.mini{border-radius:6px;padding:.3rem .5rem;font-size:.82rem;display:grid;grid-template-columns:auto 1fr;gap:.1rem .45rem;cursor:pointer;align-items:baseline}
.mini .n{font-family:var(--mono);font-size:.7rem;opacity:.8}
.mini .t{font-weight:600}
.mini .r{grid-column:2;font-size:.7rem;opacity:.8}
.klaar{font-size:.8rem;color:var(--muted)}
.klaar summary{cursor:pointer}
.klaar ul{margin:.3rem 0 0;padding-left:1.1rem}
.allgrid{font-size:.72rem;min-width:720px}
.allgrid th{position:sticky;top:0;background:var(--surface);z-index:1}
.allgrid td{vertical-align:top;cursor:pointer;min-width:120px}
.allgrid td.wn{font-family:var(--mono);cursor:default;min-width:3.5rem;white-space:nowrap}
.allgrid td.none{background:var(--leeg);cursor:default}
.allgrid tr.now td{background:var(--info-bg)}
.allgrid tr.vak td{background:var(--uitval);color:var(--uitval-fg);text-align:center;font-size:.65rem;letter-spacing:.05em;text-transform:uppercase;cursor:default;padding:.15rem}
.allgrid .bar2{display:flex;gap:2px;margin-bottom:.15rem}
.allgrid .bar2 i{flex:1;height:5px;border-radius:2px;display:block}
.allgrid .cl{line-height:1.25;color:var(--muted)}
.allgrid .tz{color:var(--toets-fg);font-family:var(--mono)}
.allgrid .ag{color:var(--warn)}
/* lesmodus */
.pres{position:fixed;inset:0;z-index:40;background:#141a26;color:#f1f3f7;display:flex;flex-direction:column;color-scheme:dark}
.pres[hidden]{display:none}
.pslide{flex:1;display:flex;flex-direction:column;justify-content:center;padding:4vh max(16px,env(safe-area-inset-left,0px),6vw);max-width:100%;overflow:auto;font-family:var(--body)}
.pslide .eyebrow{font-family:var(--mono);font-size:clamp(.8rem,1.6vw,1.2rem);letter-spacing:.06em;text-transform:uppercase;color:#a9b5cc;margin:0 0 1.2rem}
.pslide h1{font-family:var(--display);font-size:clamp(2rem,6vw,5rem);line-height:1.05;margin:0 0 1.5rem;color:#fff}
.pslide h2{font-family:var(--display);font-size:clamp(1.5rem,4vw,3.4rem);line-height:1.15;margin:0;font-weight:600;color:#fff;max-width:28ch}
.pslide .vraag{font-size:clamp(1.3rem,3vw,2.6rem);color:#ffd88a;font-style:italic;margin:0}
.pslide .sub{font-size:clamp(1rem,2vw,1.6rem);color:#c8d0e0;margin:1.5rem 0 0;max-width:60ch}
.pslide ul.crit{font-size:clamp(1.1rem,2.6vw,2.2rem);line-height:1.4;margin:1.5rem 0 0;padding-left:1.2em;color:#e3e8f2;max-width:34ch}
.pslide ul.links{font-size:clamp(1.1rem,2.4vw,2rem);line-height:1.5;margin:0 0 1rem;padding-left:1.2em}
.pslide ul.links a{color:#8fb4ff}
.pslide.check h2{color:#b8f0c8}
.pslide.id h2{color:#e9d2ff}
.pslide.fase .eyebrow{color:#ffd88a}
.pbar{display:flex;align-items:center;gap:.6rem;padding:.6rem max(16px,env(safe-area-inset-left,0px));background:#0d1119;font-family:var(--mono);font-size:.85rem;flex-wrap:wrap}
.pbar .sp{flex:1}
.pbar button{background:transparent;border:1px solid #3a4660;color:#f1f3f7;border-radius:6px;padding:.3rem .7rem;font:inherit}
.pbar button.tbtn{font-size:1.1rem}
.pbar button.tbtn.over{background:#7a1f1f;border-color:#b23b3b}
.pbar button[data-p="done"]{background:#1f6b3a;border-color:#2a8f4f}
@media (prefers-reduced-motion:no-preference){.pslide{animation:fade .25s ease}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.les .acts a.start{border:1px solid currentColor;border-radius:4px;font-size:.7rem;padding:.05rem .4rem;text-decoration:none;color:inherit;font-weight:600}
/* signalen */
.sig{margin-bottom:1rem}
.sig summary{cursor:pointer;font-weight:600}
.sig ul{margin:.5rem 0 0;padding:0;list-style:none;display:grid;gap:.3rem}
.sig li{padding:.4rem .6rem;border-radius:6px;background:var(--info-bg);font-size:.9rem;display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap}
.sig li.warn{background:var(--warn-bg)}
.sig li b{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--warn)}
.sig li.info b{color:var(--accent)}
.sig li button{margin-left:auto}
/* tray */
.tray[hidden]{display:none}
.tray{border:1px dashed var(--warn);background:var(--warn-bg);border-radius:10px;padding:.6rem .8rem;margin-bottom:1rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.tray .les{min-width:220px}
/* timeline */
.tl{overflow-x:auto;padding-bottom:.5rem}
.tlgrid{display:grid;grid-auto-rows:minmax(1.6rem,auto);gap:3px;width:max-content;font-size:.72rem}
.tlgrid .rowlab{position:sticky;left:0;background:var(--surface);z-index:2;padding:.15rem .5rem .15rem 0;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-size:.65rem;display:flex;align-items:center;min-width:5.5rem}
.tlgrid .wk{text-align:center;font-family:var(--mono);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:4px}
.tlgrid .wk:hover{background:var(--uitval)}
.tlgrid .wk.now{background:var(--accent);color:var(--accent-fg)}
.tlgrid .gap{writing-mode:vertical-rl;text-align:center;color:var(--muted);background:repeating-linear-gradient(135deg,transparent 0 4px,var(--line) 4px 6px);border-radius:4px;font-size:.6rem;letter-spacing:.05em;padding:.3rem 0;display:flex;align-items:center;justify-content:center}
.tlgrid .blok{color:#fff;border-radius:4px;padding:.15rem .5rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center}
.tlgrid .cell{border-radius:4px;min-height:2.2rem;min-width:0;width:100%;word-break:break-word;max-height:3.4rem;padding:.15rem .25rem;overflow:hidden;cursor:pointer;line-height:1.15;display:flex;flex-direction:column;justify-content:center;position:relative}
.tlgrid .cell .k{position:absolute;right:2px;bottom:1px;font-size:.55rem;opacity:.75;font-family:var(--mono)}
.tlgrid .cell[draggable="true"]{cursor:grab}
.tlgrid .cell.over,.les.over{outline:2px dashed var(--accent);outline-offset:-2px}
.tlgrid .mark{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600}
.tlgrid .mark.toets{background:var(--toets);color:var(--toets-fg);border-radius:4px}
.tlgrid .mark.hd{background:var(--slow);color:var(--slow-fg);border-radius:4px}
.tlgrid .dot{display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tlgrid .dot span{display:inline-block;height:6px;border-radius:3px;background:var(--barok)}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1rem;font-size:.8rem;color:var(--muted);margin-top:.6rem}
.legend i{display:inline-block;width:.9rem;height:.9rem;border-radius:3px;vertical-align:-2px;margin-right:.3rem}
/* lessen view */
.filters{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem}
.blokhead{display:flex;align-items:center;gap:.6rem;margin:1.4rem 0 .6rem;flex-wrap:wrap}
.blokhead .sw{width:.8rem;height:.8rem;border-radius:3px}
.blokhead .meta{color:var(--muted);font-size:.85rem}
.week{display:grid;grid-template-columns:7.5rem 1fr;gap:.8rem;padding:.7rem 0;border-top:1px solid var(--line)}
.week.tw{opacity:.8}
.week .wl{font-size:.85rem}
.week .wl b{font-family:var(--display);font-size:1.1rem;display:block}
.week .wl .ev{color:var(--warn);font-size:.78rem;margin-top:.2rem}
.week .wl .cd{display:inline-block;margin-top:.3rem;font-family:var(--mono);font-size:.68rem;color:var(--toets-fg)}
.lessen{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.6rem}
.les{border-radius:8px;padding:.5rem .65rem;font-size:.88rem;min-width:0;position:relative}
.les[draggable="true"]{cursor:grab}
.les .hd{display:flex;gap:.4rem;align-items:baseline;font-size:.72rem;font-family:var(--mono);opacity:.8;margin-bottom:.15rem}
.les .hd .sp{flex:1}
.les .ti{font-weight:600}
.les .dt{font-size:.82rem;opacity:.9;margin-top:.15rem}
.les .acts{display:flex;gap:.3rem;margin-top:.4rem;flex-wrap:wrap}
.les .acts button{border:1px solid currentColor;background:transparent;border-radius:4px;font-size:.7rem;padding:.05rem .4rem;opacity:.8}
.thuis{grid-column:1/-1;font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.2rem .8rem;align-items:baseline}
.thuis b{color:var(--fg);font-weight:600}
.note{grid-column:1/-1;font-size:.85rem;background:var(--slow);color:var(--slow-fg);border-radius:6px;padding:.3rem .6rem}
/* toetsen */
.toets{border-top:4px solid var(--toets-fg)}
.toets.praktijk{border-top-color:var(--praktijk-fg)}
.toets .big{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1}
.toets dl{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;margin:.6rem 0;font-size:.88rem}
.toets dt{color:var(--muted)}
.toets dd{margin:0}
.prep{display:flex;gap:1rem;flex-wrap:wrap;margin:.5rem 0;font-size:.85rem}
.prep b{font-family:var(--display);font-size:1.3rem;display:block;line-height:1}
.toets .mv{display:flex;gap:.4rem;align-items:center;margin-top:.6rem;font-size:.85rem;flex-wrap:wrap}
/* dekking */
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:left;padding:.35rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.n{font-family:var(--mono);text-align:center;font-variant-numeric:tabular-nums}
td.n.z{color:var(--line)}
tr.miss td:first-child{color:var(--toets-fg);font-weight:600}
.tabwrap{overflow-x:auto}
/* balans */
.bar{display:flex;height:1.4rem;border-radius:6px;overflow:hidden;font-size:.7rem;font-family:var(--mono)}
.bar span{display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(14px,1fr));gap:2px;margin-top:.5rem}
.strip i{height:14px;border-radius:2px;display:block}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;margin-bottom:1rem}
.kpi div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem}
.kpi b{font-family:var(--display);font-size:1.6rem;display:block;line-height:1.1}
.kpi small{color:var(--muted)}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.15);z-index:30;overflow-y:auto;padding:1rem max(16px,env(safe-area-inset-right,0px)) 2rem 16px;transform:translateX(100%);transition:transform .2s}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.drawer .dh{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem}
.drawer form{display:grid;gap:.5rem}
.drawer fieldset{border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem;display:grid;gap:.4rem}
.drawer legend{font-family:var(--mono);font-size:.72rem;padding:0 .3rem}
.drawer label{font-size:.78rem;color:var(--muted);display:grid;gap:.15rem}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:25}
.scrim[hidden]{display:none}
.msg{font-size:.85rem;color:var(--warn);min-height:1.2rem}
/* sectie */

(in de sectievergadering)","soort":"taak","taak":true},{"id":"sv6","d":"2027-05-25","titel":"Sectievergadering","soort":"sectie","tijd":"15:00–16:30","info":"Voorstel PTO 2027-2028 met taalcontrole · materiaal tutorials · resultaten toetsweek 3"},{"id":"sv6-vs","d":"2027-05-27","titel":"Verslag en besluitenlijst van 25 mei delen in Teams","soort":"taak","taak":true},{"id":"od4","d":"2027-06-01","titel":"Ontwikkeldag 4: secties (lln vrij)","soort":"overleg","info":"Valt samen met het sectieleidersoverleg."},{"id":"slo3","d":"2027-06-01","titel":"Sectieleidersoverleg","soort":"overleg","tijd":"13:45–16:30"},{"id":"slo3-tk","d":"2027-06-03","titel":"Terugkoppeling sectieleidersoverleg 1 jun: drie regels voor de volgende sectievergadering","soort":"taak","taak":true},{"id":"sv7-ag","d":"2027-06-15","titel":"Agenda sectievergadering 22 jun versturen","soort":"taak","info":"Vast begin: besluiten- en actielijst (5 min) en taal (10 min).","taak":true},{"id":"jv","d":"2027-06-15","titel":"Jaarverslag van één A4: wat is gelukt, wat niet, wat volgend jaar","soort":"taak","taak":true},{"id":"llb6","d":"2027-06-15","titel":"Mentorenoverleg en leerlingbespreking","soort":"overleg","tijd":"15:00–16:30"},{"id":"sv7","d":"2027-06-22","titel":"Sectievergadering","soort":"sectie","tijd":"15:00–16:30","info":"Evaluatie actieplan · vooruitblik 2027-2028 · jaarverslag"},{"id":"tw4","d":"2027-06-23","titel":"Toetsweek 4 (h4, v4, v5, m3)","soort":"toets","tot":"2027-07-02"},{"id":"sv7-vs","d":"2027-06-24","titel":"Verslag en besluitenlijst van 22 jun delen in Teams","soort":"taak","taak":true},{"id":"tw5","d":"2027-06-29","titel":"Toetsweek havo 3 en vwo 3","soort":"toets","tot":"2027-07-06"},{"id":"bbv3","d":"2027-06-29","titel":"Vergadering docenten brede brugklas","soort":"overleg","tijd":"13:45–15:00","info":"Voor BB1."},{"id":"ci3","d":"2027-07-07","titel":"Eindcijfers ingevoerd in Magister","soort":"cijfers","info":"Datum is een aanname: vóór de overgangsvergaderingen van 9 juli. De toetsweek van havo 3 en vwo 3 loopt tot en met 6 juli.","taak":true,"bevestigen":true},{"id":"ov1","d":"2027-07-09","titel":"Overgangsvergaderingen","soort":"rapport","tot":"2027-07-13"},{"id":"pto2","d":"2027-07-09","titel":"PTO 2027-2028 ingevoerd in web.csgpm.nl (vóór de zomervakantie)","soort":"taak","info":"Docenten vullen vóór de zomervakantie in; de sectieleider controleert in de eerste week na de vakantie.","taak":true}]}

<script>
(function(){
const $=s=>document.querySelector(s);
const DATA=JSON.parse($('#data').textContent);
const KLASSEN=['bb1','havo3','kmu3','vwo3','mavo3','mavo4','havo4','havo5','vwo4','vwo5','vwo6'];
const KLASNAAM={bb1:'BB1',havo3:'havo 3',kmu3:'keuzeuur h3',vwo3:'vwo 3',mavo3:'mavo 3',mavo4:'mavo 4',havo4:'havo 4',havo5:'havo 5',vwo4:'vwo 4',vwo5:'vwo 5',vwo6:'vwo 6'};
function prep(raw){const b=JSON.parse(JSON.stringify(raw));const kal=DATA.kalender;
  b.weken.forEach(w=>{const k=kal.weken.find(x=>x.w===w.w);if(k){if(!w.datum)w.datum=k.datum;if(!w.wk)w.wk=k.wk;}});
  if(!b.vakanties)b.vakanties=kal.vakanties.filter(v=>b.weken.some(w=>w.w===v.naWeek));
  if(!b.syllabus)b.syllabus=typeof b.meta.syllabus==='object'&&b.meta.syllabus?b.meta.syllabus:b.meta.syllabus==='geen'?{}:b.meta.syllabus==='havo'?kal.syllabusHavo:kal.syllabusVwo;
  if(!b.messiah)b.messiah=[];if(!b.kaarten)b.kaarten={};if(!b.kaartenNogTeMaken)b.kaartenNogTeMaken=[];if(!b.syllabusLaterJaren)b.syllabusLaterJaren=[];if(!b.handelingsdelen)b.handelingsdelen=[];
  return b;}
let KEY='vwo4';
let BASE=prep(DATA.klassen[KEY]);
let N=BASE.meta.lessenPerWeek;
const DAYOFF={ma:0,di:1,wo:2,do:3,vr:4};
const MND=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const DAG=['zo','ma','di','wo','do','vr','za'];
const TYPES={theorie:'Theorie',praktijk:'Praktijk',uitval:'Uitval',toets:'Toets',toetsweek:'Toetsweek',leeg:'Vrije les'};
const MOV=t=>t==='theorie'||t==='praktijk'||t==='leeg';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BLOK=id=>(S.blokken||BASE.blokken).find(b=>b.id===id);
const STATUS={gepland:'gepland',voorbereid:'voorbereid',gegeven:'gegeven'};
const lines=s=>String(s||'').split(/\n/).map(x=>x.trim()).filter(Boolean);
const matLink=m=>/^https?:\/\//i.test(m.u||'')?`<a href="${esc(m.u)}" target="_blank" rel="noopener">${esc(m.t||m.u)}</a>`:`<span title="${esc(m.u||'')}">${esc(m.t||m.u||'')}</span>${m.u?` <small class="lead">(${esc(m.u)})</small>`:''}`;
const ALIAS={'SW VP':'SW pop','SW BA':'SW barok'};

function freshBase(b){
  const s=JSON.parse(JSON.stringify(b));const n=b.meta.lessenPerWeek;
  const weken=s.weken.map(w=>{const les=[];for(let i=0;i<n;i++){const l=w['l'+(i+1)]||{type:'leeg',titel:'Vrije les'};delete w['l'+(i+1)];les.push(l);}w.lessen=les;delete w.countdown;return w;});
  return {v:3,weken,toetsen:s.toetsen,blokken:s.blokken,tray:[],notes:{}};
}
function fresh(){return freshBase(BASE);}
// oudere opgeslagen planning: lesinhoud (vraag, doel, fasen…) uit de nieuwe basis overnemen waar die nog ontbreekt
function migrate(d,b){if(!d||!d.v||d.v>=3)return d;const f=freshBase(b||BASE);const FLD=['vraag','doel','criteria','fasen','formatief','identiteit','materiaal'];
  for(const w of d.weken||[]){const fw=f.weken.find(x=>x.w===w.w);if(!fw)continue;(w.lessen||[]).forEach((l,i)=>{const fl=fw.lessen[i];if(!fl||fl.titel!==l.titel)return;for(const k of FLD)if(l[k]==null&&fl[k]!=null)l[k]=JSON.parse(JSON.stringify(fl[k]));});}
  if(!d.blokken)d.blokken=JSON.parse(JSON.stringify(f.blokken));d.v=3;return d;}
// andere klassen: basis en (indien opgeslagen) planning, voor het overzicht van alle klassen
const OTHER={};const OTHERBASE={};
function baseFor(k){if(k===KEY)return BASE;return OTHERBASE[k]||(OTHERBASE[k]=prep(DATA.klassen[k]));}
function stateFor(k){if(k===KEY)return S;if(!OTHER[k]){try{const j=localStorage.getItem('leergang-'+k);if(j){const d=JSON.parse(j);if(d&&d.v)OTHER[k]=migrate(d,baseFor(k));}}catch(e){}}return OTHER[k]||freshBase(baseFor(k));}
// wat moet er klaarliggen voor een les: handmatige lijst + afgeleid uit de lesinhoud
const BENODIGD=[[/keyboard|piano|toetsenbord/i,'Keyboards'],[/gitaar|ukelele|ukulele/i,'Gitaren / ukeleles'],[/drum|groove|backbeat|slagwerk|percussie/i,'Drums / percussie'],[/\bbas\b|basgitaar|baslijn/i,'Basgitaar'],[/opnem|opname/i,'Opnameapparatuur (telefoon of recorder)'],[/wisbordje/i,'Wisbordjes en stiften'],[/exit ticket|briefje/i,'Exit-ticketbriefjes'],[/luister|fragment|beluister/i,'Beamer en geluid; luisterfragmenten klaarzetten'],[/metronoom/i,'Metronoom'],[/analyseblad/i,'Analysebladen'],[/partituur/i,'Partituren'],[/musicbox|oefentoets|proeftoets|examentraining|CE-vorm|laptop/i,'Laptops en koptelefoons (MusicBox)'],[/zing|koor|stem/i,'Zangbladen / koorpartijen'],[/presentatie|digibord/i,'Digibord met presentatie']];
const FT=f=>typeof f==='string'?f:(f.min||0)+' min · '+(f.soort||'')+': '+(f.kop||'');
function benodigd(l,w){const out=[];const add=x=>{if(x&&!out.includes(x))out.push(x);};
  (l.benodigd||[]).forEach(add);
  const txt=[l.titel,l.detail,(l.fasen||[]).map(FT).join(' '),(l.formatief||{}).tekst,(l.formatief||{}).soort].join(' ');
  for(const [re,naam] of BENODIGD)if(re.test(txt))add(naam);
  (l.kaart||[]).forEach(k=>add('Didactische kaart '+k));
  if((l.messiahNieuw||[]).length||(l.messiahHerhaal||[]).length)add('Messiah: koorpartijen en oefentracks');
  (l.materiaal||[]).forEach(m=>add(m.t+(m.u?' ('+(/^https?:/i.test(m.u)?'link':m.u)+')':'')));
  return out;}
let S=fresh();
let tab='jaar';
let filt={blok:'',type:'',q:''};

/* ---------- afgeleide gegevens ---------- */
function lesDate(w,li){if(!BASE.meta.lesdagen)return null;const d=new Date(w.datum+'T12:00:00');d.setDate(d.getDate()+(DAYOFF[BASE.meta.lesdagen[li]]||0));return d;}
const fmtD=d=>d?`${DAG[d.getDay()]} ${d.getDate()} ${MND[d.getMonth()]}`:'';
const lesLabel=(li)=>`les ${li+1}`+(BASE.meta.lesdagen?' · '+BASE.meta.lesdagen[li]:'');
function toetsWeek(t){const w=S.weken.find(w=>w.lessen.some(l=>l.type==='toets'&&l.toets===t.id));return w?w.w:t.week;}
function toetsById(id){return S.toetsen.find(t=>t.id===id);}
function coverage(){const cov={};for(const w of S.weken)for(const l of w.lessen)if((l.type==='theorie'||l.type==='praktijk'))for(const s of (l.syll||[]))(cov[s]=cov[s]||[]).push(w.w);return cov;}
function stats(blok){const c={theorie:0,praktijk:0,uitval:0,toets:0,toetsweek:0,leeg:0,slow:0,lessen:0,formatief:0,identiteit:0,materiaal:0,gegeven:0,doel:0};
  for(const w of S.weken){if(blok&&w.blok!==blok)continue;for(const l of w.lessen){c[l.type]=(c[l.type]||0)+1;c.lessen++;const echt=l.type==='theorie'||l.type==='praktijk';if(echt&&(l.kaart||[]).length)c.slow++;
    if(echt){if(l.formatief&&(l.formatief.soort||l.formatief.tekst))c.formatief++;if(l.identiteit)c.identiteit++;if((l.materiaal||[]).length)c.materiaal++;if(l.status==='gegeven')c.gegeven++;if(l.doel)c.doel++;}}}return c;}
function nextToets(wk){let best=null;for(const t of S.toetsen){const tw=toetsWeek(t);if(tw>=wk&&(!best||tw<best.tw))best={t,tw};}return best;}
function prepCount(t){const tw=toetsWeek(t);const bl=(t.blok||'').split('+');const c={theorie:0,praktijk:0,slow:0};
  for(const w of S.weken){if(w.w>=tw||!bl.includes(w.blok))continue;for(const l of w.lessen){if(l.type==='theorie')c.theorie++;if(l.type==='praktijk')c.praktijk++;if((l.kaart||[]).length&&(l.type==='theorie'||l.type==='praktijk'))c.slow++;}}return c;}
function kaartWeeks(code){const al=ALIAS[code]||code;const out=[];for(const w of S.weken)for(const l of w.lessen)if(l.type==='theorie'||l.type==='praktijk')for(const k of (l.kaart||[])){if(k===al||k.startsWith(al+' ')||k===code||k.startsWith(code+' ')){out.push(w.w);break;}}return [...new Set(out)];}
function kaartFirstNeeded(code){const wk=kaartWeeks(code);if(wk.length)return wk[0];const b=BASE.blokken.find(b=>b.routekaart.some(r=>r===code||r.startsWith(code+' ')));return b?b.weken[0]:null;}
function signalen(){
  const out=[];const cov=coverage();
  for(const t of S.toetsen){const tw=toetsWeek(t);
    for(const s of (t.syllabus||[])){if(!(cov[s]||[]).some(x=>x<tw))out.push({lvl:'warn',txt:`${t.id}: eindterm ${s} (${BASE.syllabus[s]}) wordt vóór lesweek ${tw} niet behandeld.`,tab:'toetsen'});}
    const v=BASE.vakanties.find(v=>v.naWeek===tw-1);if(v)out.push({lvl:'info',txt:`${t.id} valt direct na de ${v.naam.toLowerCase()} (lesweek ${tw}).`,tab:'toetsen'});
    if(t.soort==='praktijk'){const p=prepCount(t);if(p.praktijk<3)out.push({lvl:'warn',txt:`${t.id}: maar ${p.praktijk} praktijkles(sen) ter voorbereiding.`,tab:'toetsen'});}
  }
  if(S.tray.length)out.push({lvl:'warn',txt:`${S.tray.length} les${S.tray.length>1?'sen':''} niet ingepland: sleep ze naar een vrije les of zet ze terug.`,tab:'lessen'});
  for(const s of Object.keys(BASE.syllabus)){if(!cov[s]&&!BASE.syllabusLaterJaren.includes(s))out.push({lvl:'warn',txt:`Eindterm ${s} (${BASE.syllabus[s]}) komt dit jaar niet voor en staat niet gepland voor een later leerjaar.`,tab:'dekking'});}
  for(const b of BASE.blokken){const c=stats(b.id);if(!c.theorie&&!c.praktijk){out.push({lvl:'info',txt:`${b.titel}: nog geen lessen ingevuld.`,tab:'lessen'});continue;}if(c.praktijk===0)out.push({lvl:'warn',txt:`${b.titel}: geen praktijkles meer in dit blok.`,tab:'balans'});
    if(c.slow<c.theorie/2)out.push({lvl:'info',txt:`${b.titel}: in ${c.theorie+c.praktijk-c.slow} van de ${c.theorie+c.praktijk} lessen wordt geen didactische kaart gebruikt.`,tab:'balans'});
    const n=c.theorie+c.praktijk;if(n&&c.formatief<n)out.push({lvl:'info',txt:`${b.titel}: ${n-c.formatief} van de ${n} lessen hebben nog geen formatieve check (exit ticket, wisbordje, peerfeedback…).`,tab:'lessen'});
    if(!c.identiteit)out.push({lvl:'warn',txt:`${b.titel}: nog geen enkele les met een identiteitsmoment; de rode draad van het blok ("${(b.identiteit||'').slice(0,60)}…") landt nergens in een les.`,tab:'lessen'});
    else if(c.identiteit<2)out.push({lvl:'info',txt:`${b.titel}: maar ${c.identiteit} les met een identiteitsmoment in ${n} lessen.`,tab:'lessen'});
    if(!(b.vragen||[]).length)out.push({lvl:'info',txt:`${b.titel}: nog geen essentiële vragen (Understanding by Design).`,tab:'lessen'});}
  for(const k of BASE.kaartenNogTeMaken){const f=kaartFirstNeeded(k);if(f)out.push({lvl:'info',txt:`Kaart ${k} bestaat nog niet; eerste gebruik in lesweek ${f}.`,tab:'dekking'});}
  const leeg=[];S.weken.forEach(w=>w.lessen.forEach((l,li)=>{if(l.type==='leeg')leeg.push(`${w.w}.${li+1}`);}));
  if(leeg.length)out.push({lvl:'info',txt:leeg.length>8?`${leeg.length} lessen zonder inhoud (lesweek ${leeg[0].split('.')[0]} tot en met ${leeg[leeg.length-1].split('.')[0]}).`:`Vrije les(sen) zonder inhoud: ${leeg.join(', ')}.`,tab:'lessen'});
  return out;
}

/* ---------- sturen ---------- */
function flat(){const a=[];S.weken.forEach((w,wi)=>w.lessen.forEach((l,li)=>a.push({wi,li})));return a;}
function rangeFrom(idx){const f=flat();const r=[];for(let i=idx;i<f.length;i++){const l=S.weken[f[i].wi].lessen[f[i].li];if(l.type==='toets'||l.type==='toetsweek')break;if(MOV(l.type))r.push(f[i]);}return r;}
function idxOf(wi,li){return flat().findIndex(p=>p.wi===wi&&p.li===li);}
const get=p=>S.weken[p.wi].lessen[p.li];
const set=(p,l)=>{S.weken[p.wi].lessen[p.li]=l;};
function toTray(l,van){if(l&&l.type!=='leeg')S.tray.push(Object.assign({},l,{van}));}
function uitval(wi,li){
  const r=rangeFrom(idxOf(wi,li));const L=r.map(get);
  set({wi,li},{type:'uitval',titel:'Valt uit (zelf ingesteld)',manual:true});
  for(let k=1;k<r.length;k++)set(r[k],L[k-1]);
  toTray(L[L.length-1],'lesweek '+S.weken[r[r.length-1].wi].w);
  commit();
}
function herstel(wi,li){
  const r=rangeFrom(idxOf(wi,li)+1);const L=r.map(get);
  set({wi,li},L[0]||S.tray.shift()||{type:'leeg',titel:'Vrije les'});
  for(let k=0;k<r.length-1;k++)set(r[k],L[k+1]);
  if(r.length){const t=S.tray.shift();set(r[r.length-1],t?stripVan(t):{type:'leeg',titel:'Vrije les'});}
  commit();
}
function stripVan(l){const c=Object.assign({},l);delete c.van;return c;}
function swap(a,b){const la=get(a),lb=get(b);if(!MOV(la.type)||!MOV(lb.type))return;set(a,lb);set(b,la);commit();}
function trayTo(i,p){const l=get(p);if(!MOV(l.type))return;const t=S.tray.splice(i,1)[0];toTray(l,'lesweek '+S.weken[p.wi].w);set(p,stripVan(t));commit();}
function trayAuto(i){const f=flat();const p=f.find(q=>get(q).type==='leeg');if(!p){msg('Geen vrije les beschikbaar. Zet eerst een les op uitval of sleep handmatig.');return;}trayTo(i,p);}
function moveToets(id,wk){
  const t=toetsById(id);const f=flat();
  const cur=f.find(p=>{const l=get(p);return l.type==='toets'&&l.toets===id;});
  const tgtW=S.weken.findIndex(w=>w.w===wk);if(tgtW<0)return;
  const tw=S.weken[tgtW];let tgt=null;
  for(let li=0;li<tw.lessen.length;li++){const l=tw.lessen[li];if(l.type==='toetsweek'||(t.soort==='praktijk'&&MOV(l.type))||(t.soort==='theorie'&&MOV(l.type))){tgt={wi:tgtW,li};if(l.type==='toetsweek')break;}}
  if(!tgt){msg(`Lesweek ${wk} heeft geen vrije plek voor ${id}.`);return;}
  if(cur){set(cur,S.weken[cur.wi].toetsweek?{type:'toetsweek',titel:S.weken[cur.wi].toetsweek}:{type:'leeg',titel:'Vrije les'});}
  const old=get(tgt);if(old.type!=='toetsweek')toTray(old,'lesweek '+wk);
  set(tgt,{type:'toets',toets:id,titel:`${t.id}: ${t.naam}`});
  t.week=wk;commit();
}
function commit(){render();save();}
let msgT;function msg(s){const el=$('#msg');if(el){el.textContent=s;clearTimeout(msgT);msgT=setTimeout(()=>{el.textContent='';},6000);}}

  $('#v-balans').innerHTML=h;
}

  if(b.dataset.pres){const [wi,li]=b.dataset.pres.split(':').map(Number);openPres(wi,li);return;}
  if(b.dataset.goklas){const k=b.dataset.goklas,wi=+b.dataset.gowi,li=b.dataset.goli!=null?+b.dataset.goli:undefined;if(k!==KEY){tab='lessen';setKlas(k);}else{tab='lessen';render();location.hash=KEY+'/'+tab;}openDrawer(wi,li);return;}
  if(b.dataset.tab){tab=b.dataset.tab;location.hash=KEY+'/'+tab;render();return;}
  if(b.dataset.go){tab=b.dataset.go;location.hash=KEY+'/'+tab;render();return;}
  if(b.dataset.blok){e.preventDefault();openBlok(b.dataset.blok);return;}
  if(b.dataset.les){const [wi,li]=b.dataset.les.split(':').map(Number);openDrawer(wi,li);return;}
  if(b.dataset.edit!=null&&b.tagName==='BUTTON'){openDrawer(+b.dataset.edit);return;}
  if(b.dataset.uitval){const [wi,li]=b.dataset.uitval.split(':').map(Number);uitval(wi,li);return;}
  if(b.dataset.herstel){const [wi,li]=b.dataset.herstel.split(':').map(Number);herstel(wi,li);return;}
  if(b.dataset.auto!=null){trayAuto(+b.dataset.auto);return;}
  if(b.dataset.open!=null&&!e.target.closest('button')){openDrawer(+b.dataset.open);return;}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='fBlok'){filt.blok=t.value;renderLessen();}
  if(t.id==='fType'){filt.type=t.value;renderLessen();}
  if(t.dataset.mv){moveToets(t.dataset.mv,+t.value);}
  if(t.dataset.sdone){if(t.checked)SS.done[t.dataset.sdone]=true;else delete SS.done[t.dataset.sdone];sCommit();}
  if(t.id==='sKlaar'){sKlaar=t.checked;renderSectie();}
});
document.addEventListener('input',e=>{if(e.target.id==='fQ'){filt.q=e.target.value;renderLessen();const i=$('#fQ');i.focus();i.setSelectionRange(i.value.length,i.value.length);}});
let drag=null;
document.addEventListener('dragstart',e=>{const el=e.target.closest('[draggable="true"]');if(!el)return;drag=el.dataset.tray!=null?{tray:+el.dataset.tray}:{wi:+el.dataset.wi,li:+el.dataset.li};e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','les');}catch(x){}});
document.addEventListener('dragover',e=>{const el=e.target.closest('.cell[data-wi],.les[data-wi]');if(!el||!drag)return;const l=S.weken[+el.dataset.wi].lessen[+el.dataset.li];if(!MOV(l.type))return;e.preventDefault();el.classList.add('over');});
document.addEventListener('dragleave',e=>{const el=e.target.closest('.cell,.les');if(el)el.classList.remove('over');});
document.addEventListener('drop',e=>{const el=e.target.closest('.cell[data-wi],.les[data-wi]');if(!el||!drag)return;e.preventDefault();const p={wi:+el.dataset.wi,li:+el.dataset.li};
  if(drag.tray!=null)trayTo(drag.tray,p);else if(!(drag.wi===p.wi&&drag.li===p.li))swap(drag,p);drag=null;});
document.addEventListener('dragend',()=>{document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));drag=null;});
$('#scrim').onclick=closeDrawer;
document.addEventListener('submit',e=>{if(e.target.id!=='sAdd')return;e.preventDefault();const ti=$('#sNt').value.trim(),d=$('#sNd').value;if(!ti||!d)return;
  SS.extra.push({id:'x'+Date.now().toString(36),d,titel:ti,soort:$('#sNs').value,taak:$('#sNtaak').checked||undefined});sCommit();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
$('#btnExport').onclick=()=>{const txt=JSON.stringify(S,null,1);const done=()=>setBadge(store.mode==='db'?'db':'local','JSON gekopieerd');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt));else fallbackCopy(txt);};
function fallbackCopy(txt){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();setBadge(store.mode==='db'?'db':'local','JSON geselecteerd/gekopieerd');}
let resetArmed=false;
$('#btnReset').onclick=()=>{if(!resetArmed){resetArmed=true;$('#btnReset').textContent='Zeker? Klik nogmaals';setTimeout(()=>{resetArmed=false;$('#btnReset').textContent='Terug naar studiewijzer';},4000);return;}
  resetArmed=false;$('#btnReset').textContent='Terug naar studiewijzer';S=fresh();commit();};
function readHash(){const parts=location.hash.replace('#','').split('/');let k=null,t=null;for(const p of parts){if(DATA.klassen[p])k=p;else if(TABS.some(x=>x[0]===p))t=p;}return {k,t};}
{const h=readHash();if(h.k){KEY=h.k;BASE=prep(DATA.klassen[KEY]);N=BASE.meta.lessenPerWeek;S=fresh();}if(h.t)tab=h.t;}
window.addEventListener('hashchange',()=>{const h=readHash();if(h.k&&h.k!==KEY){if(h.t)tab=h.t;setKlas(h.k);return;}if(h.t&&h.t!==tab){tab=h.t;render();}});
render();
initStore();
initSectie();
})();
</script>
